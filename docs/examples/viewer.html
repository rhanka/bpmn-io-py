<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bpmn-io example diagram (rendered with bpmn-js)</title>
<style>
  html, body, #canvas { height: 100%; margin: 0; }
  #bar { padding: 8px; font-family: sans-serif; }
</style>
</head>
<body>
<div id="bar">
  <input type="file" id="file" accept=".bpmn,.xml">
  <span>Default: <code>example.bpmn</code> (generated by the Python lib).</span>
</div>
<div id="canvas"></div>
<script src="https://unpkg.com/bpmn-js@18.6.3/dist/bpmn-viewer.production.min.js"></script>
<script>
  // Rendering only: the diagram bytes are produced by bpmn-io (Python).
  const viewer = new BpmnJS({ container: '#canvas' });
  async function render(xml) {
    try {
      await viewer.importXML(xml);
      viewer.get('canvas').zoom('fit-viewport');
    } catch (err) {
      alert('Could not render: ' + err.message);
    }
  }
  document.getElementById('file').addEventListener('change', (event) => {
    const [file] = event.target.files;
    if (file) file.text().then(render);
  });
  fetch('example.bpmn').then((r) => r.text()).then(render);
</script>
</body>
</html>
