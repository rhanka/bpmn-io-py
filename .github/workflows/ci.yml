name: CI

on:
  push:
    branches: [main, "port-*", "profile-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Vendored upstream files match UPSTREAM.lock
        run: uv run python scripts/sync_upstream.py --check
      - name: Vendored contract files match CONTRACTS.lock (BR04-EX1)
        run: uv run python scripts/sync_contracts.py --check
      - name: Upstream test-suite port coverage
        run: uv run python scripts/port_coverage.py --strict
      - name: Generated stubs match types.pyi
        run: uv run python scripts/gen_stubs.py --check

  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --group test
      - run: uv run pytest --cov --cov-report=xml -m "not oracle"

  oracle:
    name: Upstream oracle (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/oracle/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tests/oracle
      - name: Upstream test ledger matches LEDGER.json
        run: node tests/oracle/ledger.mjs --check
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --group test
      - run: uv run pytest -m oracle

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - name: Install hash-pinned twine (cyber-review S5, no --system)
        run: |
          uv venv .twine
          uv pip install --python .twine/bin/python --require-hashes -r scripts/twine-check.txt
      - run: .twine/bin/python -m twine check --strict dist/*
      - name: Install-from-wheel smoke test
        run: |
          uv venv --python 3.13 .smoke
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python -c "import bpmn_io; print(bpmn_io.__version__, bpmn_io.UPSTREAM_VERSIONS)"
      - name: Wheel contains only the runtime surface (cyber-review N6)
        run: uv run python scripts/check_wheel.py "dist/*.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
