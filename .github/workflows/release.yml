name: Release

# Tag-driven: `v1.2.3` must equal the version declared in pyproject.toml.
# Publishes to PyPI through Trusted Publishing (OIDC, no API token) with PEP 740 attestations,
# then creates the GitHub release with the built files attached.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.meta.outputs.package }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["name"])')"
          version="${TAG#v}"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          declared="$(uv version --short)"
          if [ "$declared" != "$version" ]; then
            echo "::error::tag version $version != pyproject version $declared"; exit 1
          fi
      - name: Full test-suite must pass before any release
        run: |
          uv sync --group test
          uv run pytest -m "not oracle"
          uv run python scripts/sync_upstream.py --check
          uv run python scripts/port_coverage.py --strict
      - run: uv build
      - name: Install hash-pinned twine (cyber-review S5, no --system)
        run: |
          uv venv .twine
          uv pip install --python .twine/bin/python --require-hashes -r scripts/twine-check.txt
      - run: .twine/bin/python -m twine check --strict dist/*
      - name: Install-from-wheel smoke test
        run: |
          uv venv --python 3.13 .smoke
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python -c "import bpmn_io; print(bpmn_io.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.package }}/${{ needs.build.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes
          fi
