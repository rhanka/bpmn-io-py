name: Release

# Tag-driven: `v1.2.3` must equal the version declared in pyproject.toml.
# Publishes to PyPI through Trusted Publishing (OIDC, no API token) with PEP 740 attestations,
# then creates the GitHub release with the built files attached.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.meta.outputs.package }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["name"])')"
          version="${TAG#v}"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          declared="$(uv version --short)"
          if [ "$declared" != "$version" ]; then
            echo "::error::tag version $version != pyproject version $declared"; exit 1
          fi
      - name: Full test-suite must pass before any release
        run: |
          uv sync --group test
          uv run pytest -m "not oracle"
          uv run python scripts/sync_upstream.py --check
          uv run python scripts/port_coverage.py --strict
      - run: uv build
      - run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Install-from-wheel smoke test
        run: |
          uv venv --python 3.13 .smoke
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python -c "import bpmn_py; print(bpmn_py.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.package }}/${{ needs.build.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes
          fi
