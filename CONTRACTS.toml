# Pinned profile-mechanism/1 contract artifacts (lot 0, DESIGN.md R3.3).
# `scripts/sync_contracts.py --source <conductor-folder>` copies the listed
# files from the local read-only conductor folder after verifying the DESIGN
# hash and every conductor-manifest line, and records per-file sha256 digests
# in CONTRACTS.lock. The folder location is deliberately NOT pinned here
# (copy mode reads --source or env PROFILE_CONTRACTS_SOURCE).
# `scripts/sync_contracts.py --check` is offline (CI): it compares TOML pins,
# lock digests and vendored bytes, like `scripts/sync_upstream.py --check`.

[profile-mechanism]
source = "conductor design folder, revision R3.3 (local, read-only)"
design_file = "DESIGN.md"
design_sha256 = "48139f5fd5bd789eacbf271081a95432c54d8361b1e52404e3443a25fa65782f"
manifest_file = "MANIFEST-R33.sha256"
manifest_sha256 = "dbdbdbb8a61e87e76ea8e198561b86ffa1bbe86ea71a09261ab70ca31ef43dd3"
dest = "contracts/profile-mechanism/1"
artifacts = [
  "profile-mechanism-1.schema.json",
  "compiled-lint-options.schema.json",
  "neutral-provider-arguments.schema.json",
  "neutral-profile.json",
  "neutral-grid-profile.json",
  "neutral-grid-profile.v1.json",
  "neutral-base.json",
  "neutral-descriptors.json",
  "neutral-metrics.json",
  "neutral-registry.json",
  "neutral-fixture.json",
  "neutral-grid-fixture.json",
  "neutral-support-fixture.R31.json",
  "neutral-chain-rule.json",
  "lint-policy-r3.json",
  "bpmnlint-11.15.0-recommended.json",
  "r3-digest-vectors.json",
  "compatibility-codes.json",
  "compatibility-verdict.schema.json",
]

# Migration source pinned by neutral-profile.json migrations[0].from. It is absent
# from the conductor manifest, so it is pinned here by its raw SHA-256 instead.
[profile-mechanism.extra."neutral-profile.R2.json"]
sha256 = "3640934c2c17894e150f93b6915f8f22fd94071f5589f924f01a37c080482801"
reason = "migration source pinned by neutral-profile.json migrations[0].from"

# R3.3 addendum (same pattern as the R3.1 extra pin): the public matrix-vector
# variant, verified line by line against a second conductor manifest. The
# non-public bytes its manifest line replaces are never vendored here.
[profile-mechanism.addendum]
manifest_file = "MANIFEST-R33-ADDENDUM.sha256"
manifest_sha256 = "1588c8a1f1818e84647359de4d9c90ff6382b8404d128947f66c858b65963222"
artifacts = [
  "r33-matrix-vectors.public.json",
]
