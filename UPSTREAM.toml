# Pinned upstream sources transposed by this repository (all MIT; see THIRD_PARTY_NOTICES.md).
# `scripts/sync_upstream.py` vendors the listed paths and records sha256 digests in UPSTREAM.lock.
# Bump a version here, re-run the script, then port the upstream changes (see CONTRIBUTING.md).
#
# Vendored destinations:
#   src/bpmn_io/resources/**   moddle descriptors (runtime data, shipped in the wheel)
#   tests/upstream/<pkg>/      upstream `lib/` (the sources transposed) and `test/` trees verbatim
#                              (specs, helpers, fixtures, snapshots) at the pinned commit: the
#                              reference for the 1:1 port, read by scripts/port_coverage.py, used as
#                              golden files by the Python tests, never executed here

[upstream.saxen]
npm = "saxen"
version = "11.2.0"
repo = "nikku/saxen"
tag = "v11.2.0"
commit = "a25d1968d1db85f2c07dce1d0a8533a32a8324fe"
license = "MIT"
vendor = [
  { from = "github", path = "lib", dest = "tests/upstream/saxen/lib" },
  { from = "github", path = "test", dest = "tests/upstream/saxen/test" },
]

[upstream.min-dash]
npm = "min-dash"
version = "5.1.0"
repo = "bpmn-io/min-dash"
tag = "v5.1.0"
commit = "960f7a8746241ba50159dcf15af3b80d8ddaf399"
license = "MIT"
# Only the helpers used by the ported libraries are transposed (into bpmn_io._min_dash); their
# upstream tests are vendored for those helpers' port.
vendor = [
  { from = "github", path = "lib", dest = "tests/upstream/min-dash/lib" },
  { from = "github", path = "test", dest = "tests/upstream/min-dash/test" },
]

